{% extends "base.html" %}
{% block title %}Mot de passe · ASTRA{% endblock %}
{% block content %}
<section class="panel auth-panel" aria-labelledby="password-title">
  <p class="eyebrow">{% if forced %}CHANGEMENT OBLIGATOIRE{% else %}COMPTE{% endif %}</p>
  <h2 id="password-title">Changer le mot de passe</h2>
  {% if message %}<p class="form-message" role="alert">{{ message }}</p>{% endif %}
  <form method="post" action="/account/password" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Mot de passe actuel</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required maxlength="256">
    <label for="new_password">Nouveau mot de passe (12 caractères au moins)</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
    <label for="confirm_password">Confirmation</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
    <button type="submit">Enregistrer</button>
  </form>
  <p class="footnote">Le changement ferme toutes vos autres sessions.</p>
</section>
{% endblock %}
